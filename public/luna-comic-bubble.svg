<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Dark Squircle -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%" fx="35%" fy="30%">
      <stop offset="0%" stopColor="#141418"/>
      <stop offset="65%" stopColor="#0A0A0D"/>
      <stop offset="100%" stopColor="#040405"/>
    </radialGradient>

    <!-- Liquid Glass Body Gradient (Cyan -> Sky Blue -> Violet -> Magenta) -->
    <linearGradient id="comic-bubble-body" x1="80" y1="60" x2="430" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="35%" stopColor="#60A5FA"/>
      <stop offset="70%" stopColor="#A855F7"/>
      <stop offset="100%" stopColor="#E879F9"/>
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="aura-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Specular Rim Gradient (Frosted Glass Contour Highlight) -->
    <linearGradient id="rim-specular" x1="100" y1="70" x2="410" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.95"/>
      <stop offset="35%" stopColor="#BAE6FD" stopOpacity="0.8"/>
      <stop offset="70%" stopColor="#E9D5FF" stopOpacity="0.5"/>
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.9"/>
    </linearGradient>

    <!-- Luminous Central Shimmer -->
    <radialGradient id="inner-core-shimmer" cx="48%" cy="46%" r="48%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.95"/>
      <stop offset="35%" stopColor="#67E8F9" stopOpacity="0.5"/>
      <stop offset="75%" stopColor="#818CF8" stopOpacity="0.15"/>
      <stop offset="100%" stopColor="#A855F7" stopOpacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" fill="none"/>

  <!-- 2. Ambient Drop Shadow Aura -->
  <path
    d="M 256 50
       L 307 131
       L 400 109
       L 376 201
       L 460 250
       L 377 301
       L 432 445
       L 313 358
       L 256 450
       L 205 368
       L 112 391
       L 136 298
       L 51 250
       L 134 199
       L 112 109
       L 205 131
       Z"
    fill="#38BDF8"
    opacity="0.25"
    filter="url(#aura-glow)"
  />

  <!-- 3. Refined Comic Bubble Glass Body (Scaled 512x512) -->
  <g filter="url(#aura-glow)">
    <path
      d="M 256 50
         L 307 131
         L 400 109
         L 376 201
         L 460 250
         L 377 301
         L 432 445
         L 313 358
         L 256 450
         L 205 368
         L 112 391
         L 136 298
         L 51 250
         L 134 199
         L 112 109
         L 205 131
         Z"
      fill="url(#comic-bubble-body)"
      stroke="url(#rim-specular)"
      stroke-width="16"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Inner Core Shimmer -->
    <path
      d="M 256 50
         L 307 131
         L 400 109
         L 376 201
         L 460 250
         L 377 301
         L 432 445
         L 313 358
         L 256 450
         L 205 368
         L 112 391
         L 136 298
         L 51 250
         L 134 199
         L 112 109
         L 205 131
         Z"
      fill="url(#inner-core-shimmer)"
      style="mix-blend-mode: screen;"
    />

    <!-- Central AI Intelligence Micro-Core & Halo -->
    <circle cx="248" cy="238" r="42" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="248" cy="238" r="70" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"/>

    <!-- Specular Reflection Highlight (Upper-Left Bevels) -->
    <path
      d="M 134 199
         L 112 109
         L 205 131
         L 256 50
         L 307 131"
      stroke="#FFFFFF"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.85"
      fill="none"
    />
  </g>
</svg>
